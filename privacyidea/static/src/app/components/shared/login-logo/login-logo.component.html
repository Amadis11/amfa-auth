@if (customLogo()) {
  <img
    alt=""
    class="custom-logo"
    height="307"
    ngSrc="{{ customLogo() }}"
    ngSrcset="1x"
    width="307" />
} @else {
  <img
    alt="AMFA"
    class="logo"
    height="140"
    ngSrc="assets/amfa.svg"
    ngSrcset="1x"
    sizes="(max-width: 307px) 100vw, 307px"
    width="307" />
}
